[project]
name = "dolos-redteam"
version = "0.1.0"
description = "Red-teaming Dolos-1.5B: finding, localizing and auditing a sabotaged safety monitor."
requires-python = ">=3.11,<3.15"
dependencies = [
    "huggingface-hub>=1.12,<2",
    "safetensors>=0.7,<1",
    "torch>=2.11,<2.12",
    "transformers>=5.7,<5.8",
    "numpy",
    "pandas",
    "matplotlib",
    "tabulate>=0.10.0",
    "scipy>=1.17.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
